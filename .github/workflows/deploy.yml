name: Deploy to EC2

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 1. Install git if it's missing
          sudo yum install -y git

          # 2. Delete the temp folder if it exists from a previous run
          sudo rm -rf /tmp/capstone-deploy

          # 3. Clone the repo into the temp folder
          sudo git clone -b develop https://github.com/sirrven/AZUBI_AFRICA_BETA_aws-secure-scalable-webapp.git /tmp/capstone-deploy

          # 4. Wipe the current web directory (Careful: this deletes old files)
          sudo rm -rf /var/www/html/*

          # 5. Copy the new files into the web directory
          sudo cp -r /tmp/capstone-deploy/* /var/www/html/

          # 6. Set permissions
          sudo chown -R apache:apache /var/www/html
          sudo chmod -R 755 /var/www/html

          # 7. Restart Apache
          sudo systemctl restart httpd
